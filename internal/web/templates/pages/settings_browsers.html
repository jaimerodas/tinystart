{{define "content"}}
<main>
  <h1>Browsers</h1>

  <section id="chrome-extension" class="user-section">
    <h2>Chrome extension</h2>
    <p>The extension shows your start page in each new Chrome tab.</p>
    <a class="action-button" data-turbo="false" href="/settings/extension.zip">Download the extension</a>
    <ol class="help-text">
      <li>Unzip the downloaded file.</li>
      <li>Open chrome://extensions and turn on Developer mode.</li>
      <li>Click "Load unpacked" and select the unzipped folder.</li>
    </ol>
  </section>
</main>
{{end}}
