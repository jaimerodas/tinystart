{{define "content"}}
<article>
  <h1>Forgot your password?</h1>

  <form action="/passwords" accept-charset="UTF-8" method="post">
    <input required="required" autofocus="autofocus" autocomplete="username" placeholder="Enter your email address"{{with .Data.Email}} value="{{.}}"{{end}} type="email" name="email" id="email" /><br>
    <input type="submit" name="commit" value="Email reset instructions" data-disable-with="Email reset instructions" />
</form>
  <a href="/">Return home</a>
</article>
{{end}}
