{{/* The flash controller says how a screen reader gets to hear this. */}}
{{define "flash"}}<div class="flash {{.Type}}" role="status" aria-live="polite" data-controller="flash">
  {{if eq .Type "notice"}}{{icon "approved"}}{{end}}
  <p data-flash-target="message">{{.Message}}</p>
  <button type="button" class="flash-dismiss" aria-label="Dismiss" data-action="flash#dismiss">{{icon "close"}}</button>
</div>
{{end}}
