# CI is script/test, and nothing that script/test isn't. The gate you run
# before every commit is the gate GitHub runs; if they ever disagree, fix the
# script, not this file.
name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  # A stdlib CVE arrives with no commit; a weekly run turns govulncheck red
  # anyway, and says when to bump the toolchain line in go.mod.
  schedule:
    - cron: "30 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: script/test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # go-version-file honours both the go directive and the toolchain pin, and
      # caches the module download and build caches on its own.
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # The browser half of the gate needs Chrome; the runner image ships it,
      # and script/test finds it on PATH as google-chrome. Say so loudly if that
      # ever stops being true, rather than silently skipping half the suite.
      - name: Chrome is present
        run: google-chrome --version

      - name: script/test
        run: ./script/test

      - name: Coverage summary
        run: |
          go test -cover ./... -coverprofile=coverage.out > /dev/null
          echo '### Coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tail -1 >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
        env:
          GOFLAGS: -mod=readonly

  image:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3

      # Kamal builds this image on a laptop at deploy time. Building it here,
      # for the droplet's architecture and without pushing, means a broken
      # Dockerfile is found on the commit that broke it, not on deploy day.
      - name: Build the production image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
