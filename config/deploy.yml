# Name of your application. Used to uniquely configure containers.
service: tinystart

# Name of the container image.
image: jaimerodas/tinystart

# Deploy to these servers.
#
# The same droplet runs tinylinks. kamal-proxy multiplexes :443 by Host header,
# so both apps share the server without knowing about each other.
#
# By name, not by IP: DNS points straight at the droplet (it has to, for
# Let's Encrypt below), so the name resolves at deploy time and the address
# stays out of the repo.
servers:
  web:
    - start.pati.to

# Enable SSL auto certification via Let's Encrypt (and allow for multiple apps on one server).
# Set ssl: false if using something like Cloudflare to terminate SSL (but keep host!).
proxy:
  ssl: true
  host: start.pati.to
  # kamal-proxy connects to your container over port 80, use `app_port` to specify a different port.
  # app_port: 3000

# Credentials for your image host.
registry:
  # Specify the registry server, if you are not using Docker Hub
  server: ghcr.io
  username: jaimerodas

  # Always use an access token rather than real password (pulled from .kamal/secrets).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Configure builder setup.
builder:
  arch: amd64

# Inject ENV variables into containers (secrets come from .kamal/secrets).
#
# The token for federated search is *not* here. The device flow obtains it
# and stores it in tinystart's database, so rotating it never needs a
# redeploy.
env:
  secret:
    # Signs every cookie and every password reset link (cmd/tinystart/main.go).
    - TINYSTART_SECRET_KEY
    - POSTMARK_API_TOKEN
  clear:
    TINYSTART_ENV: production
    TINYSTART_DB: /data/production.sqlite3
    # Only the password reset mail has absolute links. They come from here,
    # never from the request's Host header, which is whatever the client sent.
    TINYSTART_HOST: https://start.pati.to

# You trigger aliases with "kamal <alias>". You can overwrite arguments on invocation:
# "kamal logs -r job" will tail logs from the first server in the job section.
#
aliases:
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "sqlite3 /data/production.sqlite3"
  # What `bin/rails console` was mostly for. Reads the new password from the
  # terminal: kamal set-password jaime@example.com
  set-password: app exec --interactive --reuse "tinystart set-password"

# Use a persistent storage volume for the sqlite database files.
#
# This name must stay different from tinylinks'. A named volume is host-side
# storage, independent of the image. If you mount tinylinks_storage here,
# both apps land on the same production.sqlite3.
volumes:
  - "tinystart_storage:/data"

# No asset_path: the build compiles the CSS and JavaScript into the binary
# and serves them from it with content digests in their names. As a result,
# there is nothing on disk to bridge between versions. A page mid-deploy that
# asks for an old digest gets a 404, and Turbo reloads it
# (data-turbo-track="reload").

# Configure rolling deploys by setting a wait time between batches of restarts.
#
# boot:
#   limit: 10 # Can also specify as a percentage of total hosts, such as "25%"
#   wait: 2
